<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil de altimetria</title>
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
        font-family: system-ui, sans-serif;
      }

      .wrap {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 8px 0 0;
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .axis {
        stroke: #cbd5e1;
        stroke-width: 1;
      }

      .label {
        fill: #475569;
        font-size: 11px;
      }

      .error {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 120px;
        color: #475569;
        padding: 1rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="app"></div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const gpxFile = params.get("gpx");
      const stroke = params.get("color") || "#2563eb";
      const app = document.getElementById("app");

      function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const toRad = Math.PI / 180;
        const dLat = (lat2 - lat1) * toRad;
        const dLon = (lon2 - lon1) * toRad;
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(lat1 * toRad) *
            Math.cos(lat2 * toRad) *
            Math.sin(dLon / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(a));
      }

      function showError(message) {
        app.innerHTML = `<div class="error">${message}</div>`;
      }

      function createProfile(points) {
        const width = 1000;
        const height = 220;
        const padding = { top: 16, right: 18, bottom: 26, left: 44 };
        const innerWidth = width - padding.left - padding.right;
        const innerHeight = height - padding.top - padding.bottom;

        let totalDistance = 0;
        const profile = points.map((point, index) => {
          if (index > 0) {
            totalDistance += haversine(
              points[index - 1].lat,
              points[index - 1].lon,
              point.lat,
              point.lon,
            );
          }
          return { distance: totalDistance / 1000, ele: point.ele };
        });

        const elevations = profile.map((point) => point.ele);
        const minEle = Math.min(...elevations);
        const maxEle = Math.max(...elevations);
        const eleRange = Math.max(maxEle - minEle, 1);
        const totalKm = Math.max(profile[profile.length - 1].distance, 1);

        const path = profile
          .map((point, index) => {
            const x = padding.left + (point.distance / totalKm) * innerWidth;
            const y =
              padding.top +
              innerHeight -
              ((point.ele - minEle) / eleRange) * innerHeight;
            return `${index === 0 ? "M" : "L"} ${x.toFixed(2)} ${y.toFixed(2)}`;
          })
          .join(" ");

        const areaPath = `${path} L ${padding.left + innerWidth} ${
          padding.top + innerHeight
        } L ${padding.left} ${padding.top + innerHeight} Z`;

        app.innerHTML = `
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-label="Perfil de altimetria">
            <line class="axis" x1="${padding.left}" y1="${padding.top + innerHeight}" x2="${
              padding.left + innerWidth
            }" y2="${padding.top + innerHeight}"></line>
            <line class="axis" x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${
              padding.top + innerHeight
            }"></line>
            <path d="${areaPath}" fill="${stroke}22"></path>
            <path d="${path}" fill="none" stroke="${stroke}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"></path>
            <text class="label" x="${padding.left}" y="${height - 6}">0 km</text>
            <text class="label" x="${padding.left + innerWidth - 30}" y="${height - 6}">${totalKm.toFixed(
              1,
            )} km</text>
            <text class="label" x="6" y="${padding.top + 10}">${Math.round(maxEle)} m</text>
            <text class="label" x="6" y="${padding.top + innerHeight}">${Math.round(minEle)} m</text>
          </svg>
        `;
      }

      async function init() {
        if (!gpxFile) {
          showError("No se especifico ningun archivo GPX.");
          return;
        }

        const response = await fetch(gpxFile);
        if (!response.ok) {
          throw new Error("No se pudo cargar el archivo GPX.");
        }

        const xmlText = await response.text();
        const xml = new DOMParser().parseFromString(xmlText, "application/xml");
        const trackPoints = [...xml.getElementsByTagName("trkpt")]
          .map((point) => {
            const eleNode = point.getElementsByTagName("ele")[0];
            return {
              lat: Number(point.getAttribute("lat")),
              lon: Number(point.getAttribute("lon")),
              ele: Number(eleNode?.textContent || "0"),
            };
          })
          .filter(
            (point) =>
              Number.isFinite(point.lat) &&
              Number.isFinite(point.lon) &&
              Number.isFinite(point.ele),
          );

        if (!trackPoints.length) {
          throw new Error("El GPX no contiene puntos validos para generar la altimetria.");
        }

        createProfile(trackPoints);
      }

      init().catch((error) => showError(error.message));
    </script>
  </body>
</html>
