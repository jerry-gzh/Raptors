<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuenta regresiva 3° Aniversario Raptors</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background:
          linear-gradient(180deg, rgba(36, 16, 8, 0.94) 0%, rgba(24, 10, 6, 0.98) 100%);
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }

      .countdown {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.75rem;
        width: 100%;
        min-height: 100%;
        padding: 0.5rem 0;
        align-items: stretch;
      }

      .item {
        background:
          radial-gradient(circle at top, rgba(255, 220, 160, 0.22), transparent 38%),
          linear-gradient(180deg, #2a1208 0%, #43180a 32%, #8b2509 68%, #ff6a00 100%);
        color: #fff;
        border: 1px solid rgba(255, 173, 96, 0.28);
        border-radius: 14px;
        padding: 1rem 0.5rem;
        text-align: center;
        box-shadow:
          0 14px 30px rgba(61, 20, 7, 0.32),
          inset 0 1px 0 rgba(255, 214, 170, 0.16);
      }

      .value {
        display: block;
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        font-weight: 800;
        line-height: 1;
        color: #fff6e8;
        text-shadow:
          0 0 12px rgba(255, 145, 77, 0.25),
          0 2px 10px rgba(0, 0, 0, 0.24);
      }

      .label {
        display: block;
        margin-top: 0.35rem;
        font-size: 0.85rem;
        color: rgba(255, 224, 189, 0.9);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .done {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(255, 220, 160, 0.22), transparent 38%),
          linear-gradient(180deg, #2a1208 0%, #43180a 32%, #8b2509 68%, #ff6a00 100%);
        color: #fff;
        border: 1px solid rgba(255, 173, 96, 0.28);
        border-radius: 14px;
        font-size: 1.2rem;
        font-weight: 700;
        box-shadow:
          0 14px 30px rgba(61, 20, 7, 0.32),
          inset 0 1px 0 rgba(255, 214, 170, 0.16);
      }
    </style>
  </head>
  <body>
    <div id="app" class="countdown" aria-label="Cuenta regresiva"></div>
    <script>
      const target = new Date("2026-05-31T08:00:00-06:00").getTime();
      const app = document.getElementById("app");

      function render(values) {
        app.innerHTML = `
          <div class="item"><span class="value">${values.days}</span><span class="label">Días</span></div>
          <div class="item"><span class="value">${values.hours}</span><span class="label">Horas</span></div>
          <div class="item"><span class="value">${values.minutes}</span><span class="label">Minutos</span></div>
          <div class="item"><span class="value">${values.seconds}</span><span class="label">Segundos</span></div>
        `;
      }

      function tick() {
        const now = Date.now();
        const diff = target - now;

        if (diff <= 0) {
          app.className = "done";
          app.textContent = "La rodada ya comenzó";
          return;
        }

        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const minutes = Math.floor((diff % 3600000) / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);

        render({ days, hours, minutes, seconds });
      }

      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
